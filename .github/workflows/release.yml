name: Zeyn Sudoku Auto Release

on:
  workflow_dispatch: # Mengizinkan eksekusi manual
  push:
    tags:
      - 'v*' # Otomatis jalan kalau membuat release tag apa pun (v1.0, v2.0, v9.99)

jobs:
  build:
    name: Build Installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25' # KEMBALIKAN KE 25!
          distribution: 'temurin'
          cache: maven

      - name: Build Fat JAR with Maven
        run: mvn clean package

      # TAHAP WINDOWS (.exe)
      - name: Build Windows .exe Installer
        if: runner.os == 'Windows'
        run: |
          mkdir jpackage-input
          Copy-Item target\ZeynSudoku-*.jar -Destination jpackage-input\ZeynSudoku.jar
          
          # Hapus huruf 'v' dari depan tag GitHub (misal v2.0.1 jadi 2.0.1)
          $APP_VERSION = "${{ github.ref_name }}".TrimStart('v')
          
          # Tambahkan --app-version
          jpackage --type exe --dest output --name ZeynSudoku --app-version $APP_VERSION --vendor "Zeyn The Dev" --input jpackage-input --main-jar ZeynSudoku.jar --main-class com.zeynthedev.zeynsudoku.Launcher --java-options "-Xmx512m" --win-shortcut --win-menu

      # TAHAP MAC (.dmg)
      - name: Build macOS .dmg Installer
        if: runner.os == 'macOS'
        run: |
          mkdir -p jpackage-input
          cp target/ZeynSudoku-*.jar jpackage-input/ZeynSudoku.jar
          
          # Hapus huruf 'v' dari depan tag GitHub menggunakan bash string manipulation
          APP_VERSION=${GITHUB_REF_NAME#v}
          
          # Tambahkan --app-version
          jpackage --type dmg --dest output --name ZeynSudoku --app-version $APP_VERSION --vendor "Zeyn The Dev" --input jpackage-input --main-jar ZeynSudoku.jar --main-class com.zeynthedev.zeynsudoku.Launcher --java-options "-Xmx512m"

      # TAHAP UPLOAD KE GITHUB RELEASES
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') 
        with:
          files: |
            output/*.exe
            output/*.dmg
            target/ZeynSudoku-*.jar